name: Android Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 35 and build tools using runner SDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Configure Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run unit tests and build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Confirm APK output
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DALUYAN-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
